[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "normal-cone-nbody3d"
version = "1.0.0"
description = "Normal-Cone Is All You Need: Unsoftened Fulton-MacPherson Symplectic Integration of the 3D Newtonian N-Body Problem (Dual IEEE-754 Float64 / 116-bit Float128 & Lean 4 Formal Proofs)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-NC-SA-4.0 (Non-Commercial Academic Use Only; Commercial Rights Reserved to Jérémy Nusa)"}
keywords = ["celestial-mechanics", "n-body-problem", "symplectic-integrators", "normal-cone", "fulton-macpherson", "collision-regularization", "lean4", "formal-verification"]
authors = [
    {name = "Jérémy Nusa"}
]
dependencies = [
    "numpy>=1.24.0",
    "mpmath>=1.3.0",
    "matplotlib>=3.7.0",
    "numba>=0.57.0",
]

[project.optional-dependencies]
rebound = [
    "rebound>=4.0.0",
]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "normal_cone_nbody_float64*",
    "normal_cone_nbody_float128*",
    "interfaces*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
